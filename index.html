<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jort Wranglers Fantasy Football</title>
<style>
  :root {
    --garnet: #782F40;
    --gold: #CEB888;
    --dark: #1a0a0e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Georgia', 'Times New Roman', serif;
    background: radial-gradient(circle at top, var(--garnet) 0%, var(--dark) 75%);
    color: var(--gold);
    text-align: center;
    padding: 24px;
  }
  .card {
    max-width: 560px;
    width: 100%;
    border: 3px solid var(--gold);
    border-radius: 16px;
    padding: 40px 32px;
    background: rgba(0, 0, 0, 0.25);
    box-shadow: 0 0 40px rgba(206, 184, 136, 0.25);
  }
  .emblem {
    width: 84px;
    height: 84px;
    margin: 0 auto 16px;
    display: block;
  }
  .eyebrow {
    letter-spacing: 4px;
    text-transform: uppercase;
    font-size: 13px;
    color: var(--gold);
    opacity: 0.85;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 2.4rem;
    margin: 0 0 8px;
    color: #ffffff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  h2 {
    font-size: 1.1rem;
    font-weight: normal;
    margin: 0 0 36px;
    color: var(--gold);
    opacity: 0.9;
  }
  .spear-rule {
    width: 60px;
    height: 4px;
    background: var(--gold);
    margin: 0 auto 28px;
    border-radius: 2px;
  }
  a.draft-link {
    display: inline-block;
    padding: 16px 36px;
    font-size: 1.15rem;
    font-weight: bold;
    letter-spacing: 1px;
    text-decoration: none;
    color: var(--garnet);
    background: var(--gold);
    border-radius: 10px;
    border: 2px solid var(--gold);
    transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  a.draft-link:hover {
    background: transparent;
    color: var(--gold);
    transform: translateY(-2px);
  }
  footer {
    margin-top: 40px;
    font-size: 12px;
    opacity: 0.6;
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="emblem" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Spear emblem">
      <circle cx="50" cy="50" r="47" fill="none" stroke="#CEB888" stroke-width="2.5"/>
      <g fill="#CEB888">
        <polygon points="50,10 62,38 50,32 38,38"/>
        <rect x="47" y="32" width="6" height="46"/>
        <polygon points="50,90 58,76 50,80 42,76"/>
        <polygon points="50,32 58,42 50,48 42,42"/>
      </g>
      <g stroke="#CEB888" stroke-width="2" fill="none">
        <path d="M28,54 Q20,62 26,74"/>
        <path d="M72,54 Q80,62 74,74"/>
      </g>
    </svg>
    <div class="eyebrow">Florida State Seminoles &middot; Est. 1851</div>
    <h1>Jort Wranglers Fantasy Football</h1>
    <h2>Garnet &amp; Gold Draft Headquarters</h2>
    <div class="spear-rule"></div>
    <a class="draft-link" href="jort-wranglers-mock-draft_27.html">View the Jort Wranglers Mock Draft &rarr;</a>
    <footer>Go Noles! (Original spear emblem &mdash; not FSU's official mark)</footer>
  </div>
</body>
</html>
