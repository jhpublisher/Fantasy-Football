name: Legal Troubles data refresh
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch: {}
  push:
    paths: ["legal-troubles/curated/**", "legal-troubles/tools/**"]
permissions:
  contents: write
concurrency:
  group: legal-troubles-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Fail-loudly pipeline (Oct 6 org review): every tool reports its own failures; the validator decides
      # whether the new bundle is published. A failed run never overwrites the last good data/bundle.json.
      - name: Pull ESPN data, odds, news, Return Game
        working-directory: legal-troubles
        env:
          LT_CURATED: ${{ github.workspace }}/legal-troubles/curated
          LT_WATCHLIST: ${{ github.workspace }}/legal-troubles/curated/watchlist.json
          LT_TEAM_ID: "31"
        run: |
          set +e
          python3 tools/bi_refresh.py /tmp/out 20000; BI=$?
          python3 tools/news_sweep.py /tmp/out 48; NS=$?
          # Return Game store (Oct 7 redesign, Joe: stored weeks are never touched). data/rg/weeks/ = one locked file per week.
          #  add_week.py      adds only the next completed week (fetched once, verified vs ESPN per-game team stats + fantasy stats); create-only writes
          #  refresh_current  depth charts / rosters / team sites / schedule / ownership on their own cadence; a failure keeps the last good file
          #  assemble_rg.py   builds data/returns.json from stored weeks + current state with NO network
          T="$GITHUB_WORKSPACE/legal-troubles/tools/returns"; RGS="$GITHUB_WORKSPACE/legal-troubles/data/rg"
          python3 "$T/add_week.py" "$RGS" "$T"; AW=$?; [ "$AW" = "0" ] || echo "::warning::add_week failed (exit $AW); stored weeks unchanged"
          python3 "$T/add_injury_week.py" "$RGS" "$T"; AI=$?; [ "$AI" = "0" ] || echo "::warning::add_injury_week failed (exit $AI); stored injury weeks unchanged"
          python3 "$T/build_prior_returners.py" "$RGS" 2025 --add || echo "::warning::prior-season returner reference not extended"
          python3 "$T/refresh_current.py" "$RGS" "$T"; RC=$?; [ "$RC" = "0" ] || echo "::warning::refresh_current partial (exit $RC); last good current files kept"
          rm -rf /tmp/rg && python3 "$T/assemble_rg.py" "$RGS" /tmp/rg "$T"; RG=$?
          cd "$GITHUB_WORKSPACE/legal-troubles"
          if [ "$RG" = "0" ] && [ -s /tmp/rg/returns.json ]; then cp /tmp/rg/returns.json data/returns.json; elif [ "$RG" = "0" ]; then RG=1; echo "::warning::returns chain wrote no returns.json"; fi
          # Punt coverage for the opponent drawer (Oct 7): ESPN box scores, cross-checked against returns.json; a failure keeps the last good data/punting.json
          if [ "$RG" = "0" ]; then python3 tools/returns/punting.py data/returns.json /tmp/punting.json && cp /tmp/punting.json data/punting.json || echo "::warning::punting.py failed; last good data/punting.json kept"; fi
          echo "{\"bi_refresh\": $BI, \"news_sweep\": $NS, \"returns\": $RG}" > /tmp/run_status.json
          cat /tmp/run_status.json
      - name: Build candidate bundle (last good data kept and marked stale for any failed section)
        working-directory: legal-troubles
        run: |
          set +e
          rm -f /tmp/candidate.json
          python3 tools/build_bundle.py /tmp/out /tmp/candidate.json curated --prev data/bundle.json --returns data/returns.json --status /tmp/run_status.json
          echo "build_bundle exit $?"
      - name: Validate candidate
        id: validate
        working-directory: legal-troubles
        run: |
          set +e
          python3 tools/validate_bundle.py /tmp/candidate.json --out data/validation.json
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - name: Publish candidate only if valid
        if: steps.validate.outputs.rc == '0'
        working-directory: legal-troubles
        run: cp /tmp/candidate.json data/bundle.json
      - name: Rebuild site pages from the dashboard source (mkgithub.py via mksite.py)
        working-directory: legal-troubles
        run: |
          set +e
          # index.html is generated from tools/front-office-bi.html by tools/mkgithub.py; briefing.html from tools/ceo-briefing.html.
          # A failed page build keeps the committed pages (and is reported); it never touches data or curated files.
          if [ -f tools/front-office-bi.html ] && [ -f tools/ceo-briefing.html ] && [ -f tools/mkgithub.py ]; then
            python3 tools/mksite.py --bi tools/front-office-bi.html --briefing tools/ceo-briefing.html --site . --mkgithub tools/mkgithub.py || echo "::warning::mksite failed; pages not rebuilt"
          else
            echo "::warning::page sources missing in tools/; pages not rebuilt"
          fi
      - name: Commit (bundle only when valid; validation result and pages always)
        run: |
          git config user.name "Legal Troubles Front Office"
          git config user.email "actions@users.noreply.github.com"
          git add legal-troubles/data/validation.json legal-troubles/index.html legal-troubles/briefing.html
          [ -f legal-troubles/data/returns.json ] && git add legal-troubles/data/returns.json
          [ -f legal-troubles/data/punting.json ] && git add legal-troubles/data/punting.json
          # Guard: a stored week (or its raw archive) may be added, never modified or deleted
          CHG=$(git diff --name-only --diff-filter=MDRT -- legal-troubles/data/rg/weeks legal-troubles/data/rg/raw ':(glob)legal-troubles/data/rg/injuries/20*.json')
          if [ -n "$CHG" ]; then echo "::error::stored weeks changed, refusing to commit them: $CHG"; git checkout -- legal-troubles/data/rg/weeks legal-troubles/data/rg/raw legal-troubles/data/rg/injuries legal-troubles/data/rg/index.json; fi
          python3 - <<'PY' || { echo "::error::index.json lost or changed a stored week; restoring"; git checkout -- legal-troubles/data/rg/index.json; }
          import json,subprocess
          try: old=json.loads(subprocess.run(['git','show','HEAD:legal-troubles/data/rg/index.json'],capture_output=True,text=True,check=True).stdout)['weeks']
          except Exception: old={}
          new=json.load(open('legal-troubles/data/rg/index.json'))['weeks']
          assert all(w in new and new[w]['sha256']==e['sha256'] for w,e in old.items())
          PY
          git add legal-troubles/data/rg
          if [ "${{ steps.validate.outputs.rc }}" = "0" ]; then git add legal-troubles/data/bundle.json; MSG="Data refresh"; else MSG="Data refresh BLOCKED by validator (last good bundle kept)"; fi
          git diff --cached --quiet || (git commit -m "$MSG $(date -u +%Y-%m-%dT%H:%MZ)" && git pull --rebase && git push)
      - name: Fail the run if validation failed
        if: steps.validate.outputs.rc != '0'
        run: |
          echo "::error::Validator failed; data/bundle.json was NOT updated. See legal-troubles/data/validation.json"
          exit 1
