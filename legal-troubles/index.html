<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Legal Troubles Front Office BI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: BI console in the CEO Briefing's identity — sticky top bar with tabs (Overview, League, Our Roster, Market), every team and player clickable into one detail drawer so the numbers link together. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --sunk:#eceee9; --ink:#14201b; --muted:#5d6b64; --line:#d9ded9;
  --field:#1d4a3a; --brass:#8a5d12; --brass-soft:#f3e7cf; --good:#2f7d4f; --warn:#9a5212; --bar-low:#aab4ae; --bad:#b23a32; --info:#2f5d8a;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1512; --surface:#16201c; --sunk:#111a16; --ink:#e9eee9; --muted:#9aa8a1; --line:#2a3832;
  --field:#5fae8c; --brass:#e0a948; --brass-soft:#3a2e17; --good:#5cc286; --warn:#e39a52; --bad:#ec7a70; --info:#7aa9d6; --bar-low:#4b5b54; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1512; --surface:#16201c; --sunk:#111a16; --ink:#e9eee9; --muted:#9aa8a1; --line:#2a3832;
  --field:#5fae8c; --brass:#e0a948; --brass-soft:#3a2e17; --good:#5cc286; --warn:#e39a52; --bad:#ec7a70; --info:#7aa9d6; --bar-low:#4b5b54; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:12px 0;display:grid;gap:10px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:1.7rem;margin:0;line-height:1}
.brand h1 span{color:var(--brass)}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.tab:focus-visible,.link:focus-visible,.row:focus-visible,.card:focus-visible,.x:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:22px 60px;display:grid;gap:22px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:2px}
.kpi .v{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums}
.kpi .k{font-size:.78rem;color:var(--muted)}
.kpi.hl .v{color:var(--brass)}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0}
.panel h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:1.35rem;margin:0;line-height:1}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.num,th.num{text-align:right}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--sunk)}
tr.me td{background:var(--brass-soft)}
.heat tr.me td{background:none}
.heat tr.me td:first-child{box-shadow:inset 4px 0 0 var(--brass);font-weight:700}
.heat tr.me td.h100{background:color-mix(in srgb,var(--good) 28%,transparent)}
.heat tr.me td.hhigh{background:color-mix(in srgb,var(--good) 50%,transparent)}
.pbar{display:flex;align-items:center;gap:10px}.pbar .bar{flex:1}.pbar span{min-width:3.2em;text-align:right}
.flag{font-size:.82rem;border-left:3px solid var(--warn);padding:6px 10px;background:var(--sunk);border-radius:4px}
tr.cut td{border-bottom:2px dashed var(--ink)}
.link{background:none;border:0;padding:0;cursor:pointer;font-weight:600;text-align:left;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.link:hover{text-decoration-color:var(--brass)}
.chip{display:inline-block;font-family:var(--mono);font-size:.76rem;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.s-ACTIVE{color:var(--good)} .s-QUESTIONABLE,.s-DAY_TO_DAY{color:var(--warn)} .s-OUT,.s-INJURY_RESERVE,.s-DOUBTFUL,.s-SUSPENSION{color:var(--bad)}
.t-sell{color:var(--warn)} .t-claim,.t-target,.t-buy{color:var(--good)} .t-rental{color:var(--info)} .t-drop{color:var(--bad)} .t-stash{color:var(--muted)} .t-roster{color:var(--muted)}
/* 15: plan tags as neutral pills (color reserved for status/risk) */
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:.76rem;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.tag b{font-weight:700;font-family:var(--body)}
.mcol h3.n{color:var(--ink)}
/* mock chrome */
.mockbar{background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:.74rem;letter-spacing:.04em}
.mockbar .in{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mockbar b{letter-spacing:.12em}
.mockbar label{display:inline-flex;gap:6px;align-items:center;cursor:pointer;margin-left:auto}
.mockbar .lg{display:flex;gap:6px;flex-wrap:wrap}
.mockbar .lg button{font:inherit;font-size:.7rem;background:transparent;color:var(--bg);border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);border-radius:999px;padding:1px 8px;cursor:pointer}
.mockbar .lg button:hover{border-color:var(--bg)}
.nw{display:inline-grid;place-items:center;min-width:1.6em;height:1.6em;padding:0 5px;border-radius:999px;background:var(--brass);color:var(--surface);font-family:var(--mono);font-size:.68rem;font-weight:700;letter-spacing:0;vertical-align:middle;margin-left:6px}
body.nomark .nw{display:none}
/* 24: key dates strip */
.dates{display:flex;gap:6px 18px;flex-wrap:wrap;font-family:var(--mono);font-size:.72rem;color:var(--muted);padding-bottom:8px;align-items:center}
.dates b{color:var(--ink);font-weight:600}
.dates .fr{margin-left:auto}
/* 19: this week */
.week{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:10px;padding:16px}
.vs{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.vs .side{display:grid;gap:2px}
.vs .side b{font-family:var(--display);font-size:2.2rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.vs .side span{font-size:.8rem;color:var(--muted)}
.vs .mid{font-family:var(--display);font-size:1.2rem;color:var(--muted)}
.wp{display:grid;gap:4px;min-width:160px;flex:1}
.wp .bar i{background:var(--brass)}
.due{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:.9rem}
.due li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.due li:last-child{border-bottom:0}
.due time{font-family:var(--mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
/* 25: KPI deltas */
.kpi .d{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.kpi .d.up{color:var(--good)} .kpi .d.dn{color:var(--bad)}
/* 20/21: grids */
.grid td.c{text-align:center;font-family:var(--mono);font-size:.76rem}
.byec{background:color-mix(in srgb,var(--warn) 22%,transparent);font-weight:700;border-radius:4px}
.tot td{font-weight:700;border-top:2px solid var(--ink)}
.m-easy{background:color-mix(in srgb,var(--good) 26%,transparent);border-radius:4px}
.m-hard{background:color-mix(in srgb,var(--bad) 20%,transparent);border-radius:4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
/* 23: free agents */
.fa{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.fa h3{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:1.05rem;margin:0}
.fa ol{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.fa li{display:grid;gap:1px;border-bottom:1px solid var(--line);padding-bottom:6px;font-size:.88rem}
.fa li span{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
/* 16: grouped news */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.ngroup{border-bottom:1px solid var(--line);padding-block:12px;display:grid;gap:6px}
.ngroup .hd{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ngroup .more{background:none;border:0;padding:0;color:var(--info);font:inherit;font-size:.82rem;cursor:pointer;justify-self:start}
.ngroup .older{display:grid;gap:8px;padding-left:12px;border-left:2px solid var(--line)}
.ngroup .older .hl{font-size:.88rem}
.showmore{justify-self:center;font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer}
@media (max-width:900px){.week{grid-template-columns:1fr}.fa{grid-template-columns:repeat(3,minmax(0,1fr))}}

.bar{height:8px;border-radius:4px;background:var(--sunk);position:relative;min-width:80px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--field)}
.me .bar i{background:var(--brass)}
.srt{background:none;border:0;padding:0;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;display:inline-flex;gap:4px;align-items:center}
.srt i{font-style:normal;opacity:.45;font-size:.65rem}
.srt.on{color:var(--ink)}.srt.on i{opacity:1;color:var(--brass)}
.srt:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.phr{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.rst{background:var(--brass-soft);border:1px solid var(--brass);color:var(--ink);border-radius:999px;padding:2px 10px;font-family:var(--mono);font-size:.7rem;cursor:pointer}
.rst:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.planw{display:grid;gap:2px;justify-items:start}
.was{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.was b{color:var(--brass);font-weight:600}
.plan{font:inherit;font-size:.82rem;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}
.plan.mine{border-color:var(--brass);box-shadow:inset 3px 0 0 var(--brass)}
.plan:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.rg-ok{color:var(--good)} .rg-warn{color:var(--warn)} .rg-bad{color:var(--bad)} .rg-muted{color:var(--muted)}
.rgcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.rgcard{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px;background:var(--surface)}
.rgcard.rg-b-ok{border-left-color:var(--good)} .rgcard.rg-b-warn{border-left-color:var(--warn)} .rgcard.rg-b-bad{border-left-color:var(--bad)}
.rgrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;font-size:.88rem}
.rgw{display:inline-flex;gap:3px}
.rgw i{font-style:normal;font-family:var(--mono);font-size:.7rem;min-width:34px;text-align:center;padding:2px 3px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.rgw i.hi{background:color-mix(in srgb,var(--good) 30%,transparent);color:var(--ink);font-weight:700}
.rgw i.lo{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--ink)}
td.rgcell{font-size:.82rem;white-space:normal;min-width:120px}
.rgtools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rgcolw{position:relative;display:flex;justify-content:flex-end;margin-left:auto}
.rgcolbtn{font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 12px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.rgcolbtn i{font-style:normal;color:var(--muted)}
.rgcolpanel{position:absolute;right:0;top:calc(100% + 6px);z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 18%,transparent);padding:12px 14px;display:grid;gap:8px;min-width:260px;max-width:calc(100vw - 40px)}
.rgcolpanel label{display:flex;gap:8px;align-items:center;font-size:.88rem;cursor:pointer}
.rgcolpanel input{accent-color:var(--brass);width:16px;height:16px}
.rgcolact{display:flex;gap:14px;align-items:center;justify-content:flex-end;border-top:1px solid var(--line);padding-top:8px}
.rgl{font-family:var(--mono);font-size:.72rem;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--muted);margin-left:2px}
.heat td.h{text-align:center;font-family:var(--mono);font-size:.78rem;border-radius:4px}
.h100{background:color-mix(in srgb,var(--good) 28%,transparent)}
.hhigh{background:color-mix(in srgb,var(--good) 50%,transparent);font-weight:700}
.market{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
.mcol{display:grid;gap:8px}
.mcol h3{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:1.1rem;margin:0;color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:4px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--ink)}
.card .n{font-weight:600}
.card .m{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.card .r{font-size:.8rem;color:var(--muted)}
.note{font-size:.82rem;color:var(--muted);margin:0}
.banner{border-radius:10px;padding:12px 16px;display:grid;gap:4px;font-size:.9rem;border:1px solid}
.banner b{font-weight:700}.banner ul{margin:0;padding-left:20px}
.banner.red{background:color-mix(in srgb,var(--bad) 14%,var(--surface));border-color:var(--bad)}
.banner.amber{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border-color:var(--warn)}
.secmsg{font-size:.85rem;border-left:3px solid var(--warn);padding:6px 10px;background:var(--sunk);border-radius:4px}
.secmsg.err{border-left-color:var(--bad)}
.dim{color:var(--muted);font-size:.68rem;font-family:var(--mono)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--muted)}
svg text{font-family:var(--mono)}
/* drawer */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 35%,transparent);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--bg);z-index:21;border-left:1px solid var(--line);overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;align-content:start}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:start}
.dh h2{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:2rem;margin:0;line-height:1}
.x{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:1.1rem}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:2px}
.fact b{font-family:var(--display);font-size:1.5rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.fact span{font-size:.72rem;color:var(--muted)}
.why{background:var(--brass-soft);border-radius:8px;padding:12px;font-size:.92rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}
ul.list{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.o-Likely{color:var(--good)} .o-Contested{color:var(--warn)} .o-Unlikely{color:var(--bad)} .o-Hold{color:var(--info)}
.src{font-family:var(--mono);font-size:.72rem;color:var(--info)}
.news a{color:var(--ink)}
.trend li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.health{display:flex;flex-wrap:wrap;gap:6px}
.k-Rumor{color:var(--warn)} .k-Confirmed{color:var(--good)} .k-Analysis{color:var(--muted)} .k-News{color:var(--info)}
.rumor{display:grid;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
.rumor:last-child{border-bottom:0}
.rumor .c{font-weight:600}
.rumor .i{font-size:.9rem;color:var(--muted)}
.claimbox{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:6px;background:var(--surface)}
.news li{display:grid;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}
.news li:last-child{border-bottom:0}
.news .meta{font-family:var(--mono);font-size:.7rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.news .hl{font-size:.92rem}
.prac td.d{text-align:center}
.p-Full{color:var(--good)} .p-Limited{color:var(--warn)} .p-DNP{color:var(--bad)}
.memo{max-width:760px;display:grid;gap:18px}
.memo h2{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:2rem;margin:0;line-height:1}
.memo h3{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:1.25rem;margin:0}
.memo ul{margin:0;padding-left:20px;display:grid;gap:6px}
.mode{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--brass-soft);border-radius:10px;padding:14px}
.mode b{font-family:var(--display);font-size:1.6rem;font-weight:900;letter-spacing:.02em}
.memo-pick{display:flex;gap:6px;flex-wrap:wrap}
.memo-pick button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;font-family:var(--mono);font-size:.75rem}
.memo-pick button[aria-pressed="true"]{border-color:var(--ink);background:var(--sunk)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.market{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.market{grid-template-columns:1fr}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><h1>Legal Troubles <span>BI</span></h1><span class="eyebrow"><a href="briefing.html" style="color:var(--brass);font-weight:600;margin-right:12px">CEO Briefing →</a><span id="stamp">Loading data…</span></span></div>

<script>
(function(){

const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STATUS={ACTIVE:'Healthy',QUESTIONABLE:'Questionable',DAY_TO_DAY:'Day-to-day',OUT:'Out',DOUBTFUL:'Doubtful',INJURY_RESERVE:'IR',SUSPENSION:'Suspended'};

const NW=()=>'';
let M=null;
/* League facts come from the pipeline's league block (bundle b.league / extras/current.league). Defaults = project rules, used only when the block is missing. */
const LG_DEF={playoffTeams:7,regSeasonWeeks:14,playoffWeeks:[15,16,17],starters:8,currentWeek:null,waiverProcessET:null,avgWeeksRange:null};
function LGD(){const l=S.league||S.extras?.league||S.meta?.league||{};const o={...LG_DEF};for(const [k,v] of Object.entries(l))if(v!=null&&v!=='')o[k]=v;

  let pw=o.playoffWeeks;if(typeof pw==='string'){const m=pw.match(/(\d+)\D+(\d+)/);pw=m?range(+m[1],+m[2]):LG_DEF.playoffWeeks}else if(pw&&!Array.isArray(pw)&&pw.start)pw=range(+pw.start,+(pw.end??pw.start+2));else if(typeof pw==='number')pw=range(o.regSeasonWeeks+1,o.regSeasonWeeks+pw);
  o.playoffWeeks=Array.isArray(pw)&&pw.length?pw.map(Number):range(o.regSeasonWeeks+1,o.regSeasonWeeks+3);
  o.week=o.currentWeek??S.meta?.week??null;o.fromBlock=!!(S.league||S.extras?.league||S.meta?.league);return o}
const wlt=t=>`${t.w??0}-${t.l??0}${t.t?'-'+t.t:''}`;
const pct=v=>v==null||v===''||isNaN(+v)?'n/a':v+'%';
const fx=(v,d=1,r='n/a')=>v==null||v===''||isNaN(+v)?r:(+v).toFixed(d);
// Fill missing fields once so every view sees the same shape; strings get a plain reason, lists become empty lists.
function normalize(){
  for(const p of Object.values(S.raw||{})){if(!p||typeof p!=='object')continue;p.name=p.name||'Unnamed player';p.pos=p.pos||'Pos. n/a';if(!p.nfl)p.nfl='NFL team n/a';if(!p.ours&&!p.owner)p.owner='Owner unknown';
    if(!p.status)p.status='UNKNOWN';if(!isObj(p.weekly))p.weekly={};if(!Array.isArray(p.playoffs))p.playoffs=[];if(p.claim&&!isObj(p.claim))p.claim=null}
  for(const o of Object.values(S.odds||{}))(Array.isArray(o?.teams)?o.teams:[]).forEach((t,i)=>{t.name=t.name||'Unnamed team';if(t.seed==null)t.seed=i+1});
  if(S.meta)S.meta.team=S.meta.team||'Legal Troubles';
  const E=S.extras;if(E){if(Array.isArray(E.roster))E.roster.forEach(r=>{r.name=r.name||'Unnamed player';r.pos=r.pos||'Pos. n/a';r.nfl=r.nfl||'NFL team n/a';if(!Array.isArray(r.playoffs))r.playoffs=[]});
    if(Array.isArray(E.race))E.race.forEach(r=>{r.name=r.name||'Unnamed team'});
    if(isObj(E.matchup)&&!E.matchup.error){const mu=E.matchup;mu.opp=mu.opp||'Opponent n/a';if(!Array.isArray(mu.flags))mu.flags=[];if(!Array.isArray(mu.oppStarters))mu.oppStarters=[]}
    if(isObj(E.freeAgents))for(const k of Object.keys(E.freeAgents))if(Array.isArray(E.freeAgents[k]))E.freeAgents[k]=E.freeAgents[k].filter(x=>x&&x.name)}
  if(Array.isArray(S.waivers?.order))S.waivers.order.forEach(x=>{x.team=x.team||'Team n/a'});
  for(const k of ['ours','league'])if(S.news?.[k]&&!Array.isArray(S.news[k].items))S.news[k].items=[];
  for(const k of ['ours','league'])(S.news?.[k]?.items||[]).forEach(i=>{i.player=i.player||'Unnamed player';i.headline=i.headline||'(no headline)'});
  if(S.news?.desk){const d=S.news.desk;if(!Array.isArray(d.rumors))d.rumors=[];if(!Array.isArray(d.trending))d.trending=[];d.rumors.forEach(r=>{r.player=r.player||'Unnamed player'});d.trending.forEach(t=>{t.player=t.player||'Unnamed player'})}
  for(const p of Object.values(S.practice?.players||{}))if(!isObj(p.days))p.days={};
  for(const sc of Object.values(S.scores||{}))if(sc&&!isObj(sc.scores))sc.scores={}}
const range=(a,b)=>Array.from({length:Math.max(0,b-a+1)},(_,i)=>a+i);
const ordn=n=>n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th');
const wkRange=a=>!a||!a.length?'':a.length===1?`Week ${a[0]}`:`Weeks ${a[0]}–${a[a.length-1]}`;
function avgWeeksTxt(){const r=LGD().avgWeeksRange;if(Array.isArray(r)&&r.length)return wkRange(r.length===2?range(+r[0],+r[1]):r.map(Number));if(r&&typeof r==='object'&&r.from!=null)return wkRange(range(+r.from,+(r.to??r.from)));
  if(typeof r==='string'&&r.trim())return /week/i.test(r)?r:'Weeks '+r;const ws=Object.values(S.scores).map(s=>+s.week).filter(Boolean).sort((a,b)=>a-b);return ws.length?wkRange(range(ws[0],ws[ws.length-1]))+' (from score data)':'weeks played so far'}
const TZ='America/New_York';
// ET wall-clock parts of an instant, and the instant of an ET wall-clock time
function etParts(d){const f=new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',hourCycle:'h23'}).formatToParts(d);const g=k=>+f.find(x=>x.type===k).value;return {y:g('year'),m:g('month'),d:g('day'),h:g('hour'),mi:g('minute')}}
function etInstant(y,m,d,h,mi){let t=Date.UTC(y,m-1,d,h,mi);for(let i=0;i<2;i++){const p=etParts(new Date(t));t+=(Date.UTC(y,m-1,d,h,mi)-Date.UTC(p.y,p.m-1,p.d,p.h,p.mi))}return new Date(t)}
// waiverProcessET: ISO instant ("...Z"/offset), ET wall time ("2026-10-07T03:00"), or a time of day ("3:00 AM") applied to dates.waivers
function waiverProcess(){const w=LGD().waiverProcessET,base=M?.dates?.waivers;
  if(w&&typeof w==='string'){if(/[zZ]|[+-]\d\d:?\d\d$/.test(w)&&!isNaN(new Date(w)))return new Date(w);
    let m=w.match(/^(\d{4})-(\d{2})-(\d{2})[T ](\d{1,2}):(\d{2})/);if(m)return etInstant(+m[1],+m[2],+m[3],+m[4],+m[5]);
    m=w.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i);if(m&&base){let h=+m[1]%12+(/pm/i.test(m[3]||'')?12:0);if(!m[3])h=+m[1];const p=etParts(new Date(base));return etInstant(p.y,p.m,p.d,h,+(m[2]||0))}}

// claims are due 10:30 PM ET the night before waivers process
function waiverDue(){const w=waiverProcess();if(!w||isNaN(w))return null;const p=etParts(w),prev=new Date(Date.UTC(p.y,p.m-1,p.d)-864e5);return etInstant(prev.getUTCFullYear(),prev.getUTCMonth()+1,prev.getUTCDate(),22,30)}
/* Validation + freshness (pipeline adds b.validation, section {stale,staleSince,reason} / {error}, curated {expired}) */
let STALE_H=6;
function dataTimeMaxAge(){if(S.validation?.maxAgeHours)STALE_H=+S.validation.maxAgeHours}
function dataTime(){dataTimeMaxAge();for(const t of [S.meta?.updatedAt,S.builtAt,S.extras?.builtAt]){if(!t)continue;const d=new Date(t);if(!isNaN(d))return d}return null}   // ESPN numbers time first
function sections(){const E=S.extras||{},N=S.news||{};return [['ESPN numbers',S.meta],['Playoff odds',latestOdds()],['Waiver order',S.waivers],['This week',E.matchup],['Seed race',E.race],['Bye and playoff grids',E.roster],['Free agents',E.freeAgents],['Key dates',E.dates],['Extras',S.extras],
  ['Our news',N.ours],['League news',N.league],['Rumors and trending',N.desk],['Practice reports',S.practice],['Returns',S.returns],['Memo',S.memos&&Object.values(S.memos).slice(-1)[0]]]}
const isObj=o=>o&&typeof o==='object'&&!Array.isArray(o);
function secProblem(o){if(!isObj(o))return null;if(o.ok===false&&!o.error&&!o.stale)return {err:true,txt:`failed${o.reason?': '+o.reason:''}`};if(o.error)return {err:true,txt:`failed: ${o.error}`};if(o.stale)return {err:false,txt:`stale since ${o.staleSince?fmtD(o.staleSince):'an earlier refresh'}${o.reason?` (${o.reason})`:''}`};return null}
// short message that replaces an empty or broken panel
function secMsg(o,label,what){const p=secProblem(o);if(p)return `<div class="secmsg ${p.err?'err':''}"><b>${esc(label)}</b> ${esc(p.txt)}.${p.err?' Showing nothing rather than old numbers.':' Numbers below are from that refresh.'}</div>`;
  return o==null?`<div class="secmsg"><b>${esc(label)}:</b> not in this refresh${what?` (${esc(what)})`:''}. Last full update ${dataTime()?fmtD(dataTime()):'unknown'}.</div>`:''}
function missingPanel(title,o,what){return `<section class="panel"><div class="ph"><h2>${esc(title)}</h2></div>${secMsg(o,title,what)||`<p class="note">No ${esc(title.toLowerCase())} data in this refresh.</p>`}</section>`}
function allProblems(){const seen=new Set(),out=[];const add=(l,p)=>{if(!p)return;const k=l.toLowerCase();if(seen.has(k))return;seen.add(k);out.push([l,p])};
  sections().forEach(([l,o])=>add(l,secProblem(o)));
  Object.entries(S.sections||{}).forEach(([k,o])=>add(SECNAME[k]||k,secProblem(o)));

  return out}
const SECNAME={meta:'ESPN numbers',players:'Players',scores:'Scores',odds:'Playoff odds',waivers:'Waiver order',nfl:'NFL schedule',curated:'Staff notes',extras:'Extras',
  'extras.matchup':'This week','extras.race':'Seed race','extras.roster':'Bye and playoff grids','extras.freeAgents':'Free agents','extras.dates':'Key dates','extras.prev':'Change vs last week',
  news:'News','news.ours':'Our news','news.league':'League news','news.desk':'Rumors and trending',practice:'Practice reports',memos:'Memo',returns:'Returns'};
function banners(){const V=S.validation,out=[];
  if(S.dbError)out.push(`<div class="banner red" role="alert"><b>Database read failed:</b> ${esc(S.dbError)}. Some panels may be empty or old.</div>`);

  if(V&&V.ok===false){const f=(V.failures||[]).map(x=>typeof x==='string'?x:(x.msg||x.message||JSON.stringify(x)));
    out.push(`<div class="banner red" role="alert"><b>Data check failed${V.checkedAt?` (${fmtD(V.checkedAt)})`:''}. Data frozen at ${V.bundleBuiltAt||S.builtAt?fmtD(V.bundleBuiltAt||S.builtAt):'the last good refresh'}; do not act on new numbers until Rich clears it.</b>${f.length?`<ul>${f.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<span>The validator gave no details.</span>'}</div>`)}

  const am=[],dt=dataTime();if(dt){const h=(Date.now()-dt)/36e5;if(h>STALE_H)am.push(`Numbers are ${h>=48?Math.round(h/24)+' days':Math.round(h)+' hours'} old (last update ${fmtD(dt)}). The refresh may have stopped.`)}

  return out.join('')}
function checksTxt(){const V=S.validation;return !V?'Checks: no validation result in this refresh':V.ok===false?`Checks: FAILED (${(V.failures||[]).length})`:`Checks: passed${V.checkedAt?' '+fmtShort(V.checkedAt):''}`}
const fmtShort=t=>{try{return new Date(t).toLocaleString('en-US',{timeZone:TZ,month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' ET'}catch(e){return String(t)}};
const isExpired=x=>!!(x&&(x.expired===true||(x.expires&&new Date(x.expires)<new Date())));
const fmtD=t=>{try{const d=new Date(t);if(isNaN(d))return String(t||'date unknown');return d.toLocaleString('en-US', {timeZone:'America/New_York',weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' ET'}catch(e){return String(t)}};
const delta=(now,was,unit='',dec=0)=>{const d=+(now-was).toFixed(dec);return d===0?'<span class="d">— same as last wk</span>':`<span class="d ${d>0?'up':'dn'}">${d>0?'▲':'▼'} ${Math.abs(d)}${unit} vs last wk</span>`};
function latestOdds(){const ks=Object.keys(S.odds||{}).filter(k=>Array.isArray(S.odds[k]?.teams)).sort();return ks.length?S.odds[ks[ks.length-1]]:null}

/* ---------- charts ---------- */
function niceStep(m){const raw=m/3,p=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function barsSVG(vals,{w=420,h=150,line=null,hi=null,labelPrefix='Wk ',bye=null}={}){
  const ks=Object.keys(vals).map(Number).sort((a,b)=>a-b); if(!ks.length) return '<p class="note">No games played yet this season.</p>';
  const nums=ks.map(k=>vals[k]).filter(v=>v!=null), raw=Math.max(line||0,...nums,1), step=niceStep(raw), top=Math.ceil(raw*1.1/step)*step;
  const padL=34,padB=22,padT=12, bw=(w-padL-8)/ks.length, y=v=>padT+(h-padT-padB)*(1-Math.max(0,v)/top);

  ks.forEach((k,i)=>{const v=vals[k],x=padL+i*bw+bw*.18,bwid=bw*.64,cx=x+bwid/2;
    g+=`<text x="${cx}" y="${h-6}" text-anchor="middle" font-size="10" style="fill:var(--muted)">${labelPrefix}${k}</text>`;
    if(v==null){g+=`<text x="${cx}" y="${h-padB-6}" text-anchor="middle" font-size="12" style="fill:var(--muted)"><title>${k===bye?'Bye week':'Did not play'}</title>${k===bye?'Bye':'DNP'}</text>`;return}
    const col=hi?(v>=hi?'var(--good)':'var(--bar-low)'):'var(--field)';
    g+=`<rect x="${x}" y="${y(v)}" width="${bwid}" height="${Math.max(1,h-padB-y(v))}" rx="3" style="fill:${col}"/><text x="${cx}" y="${y(v)-4}" text-anchor="middle" font-size="10" style="fill:var(--ink)">${(+v).toFixed(1)}</text>`});
  if(line){g+=`<line x1="${padL}" x2="${w-4}" y1="${y(line)}" y2="${y(line)}" style="stroke:var(--brass)" stroke-dasharray="4 3"/><text x="${w-6}" y="${y(line)-4}" text-anchor="end" font-size="10" style="fill:var(--brass)">${line}</text>`}

}
function spark(vals){const ks=Object.keys(vals).map(Number).sort((a,b)=>a-b);if(!ks.length)return'';const w=70,h=20,max=Math.max(1,...ks.map(k=>vals[k]));

function trendSVG(){
  const ks=Object.keys(S.odds).filter(k=>Array.isArray(S.odds[k]?.teams)).sort(); if(ks.length<2) return `<p class="note">The trend line starts after a second week of odds. Each weekly refresh adds a point.</p>`;
  const lt=latestOdds(); const names=lt.teams.slice().sort((a,b)=>b.playoffPct-a.playoffPct).slice(0,4).map(t=>t.name);
  const w=520,h=170,pl=34,pb=22,pt=8,x=i=>pl+(w-pl-10)*i/(ks.length-1),y=v=>pt+(h-pt-pb)*(1-v/100);
  let g='';[0,50,100].forEach(v=>g+=`<line x1="${pl}" x2="${w-6}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" style="fill:var(--muted)">${v}%</text>`);
  ks.forEach((k,i)=>g+=`<text x="${x(i)}" y="${h-6}" text-anchor="middle" font-size="10" style="fill:var(--muted)">Wk ${S.odds[k].week}</text>`);
  names.forEach((n,j)=>{const me=n===S.meta?.team;const p=ks.map((k,i)=>{const t=S.odds[k].teams.find(z=>z.name===n);return t?`${x(i)},${y(t.playoffPct)}`:null}).filter(Boolean).join(' ');

/* ---------- views ---------- */

    return `<tr><td>${w}</td><td>${x.home?'vs':'@'} ${esc(x.opp)}</td><td class="num">${x.kickoffs}</td><td class="num">${x.returned}</td><td class="num">${x.ret_yds_allowed}</td><td class="num">${x.touchback}</td><td class="num">${x.short_of_landing_zone}</td><td class="num">${x.out_of_bounds}</td><td class="num">${x.onside_attempts}</td></tr>`}).join('')}
  </tbody></table></div><p class="note">Returned = kickoffs the other team ran back (this is what a returner needs). Short of zone = penalty, ball placed at the 40, no return. Source: ESPN play-by-play, checked against ESPN team stats.</p></section>`)}
// team split from the current model (kick / punt / both)
function rgSplit(M_,t){const x=M_.teams[t];if(!x)return null;const played=M_.W.filter(w=>{const g=x.weeks?.[w];return g&&!g.bye});if(!played.length)return null;
  const agg=ws=>{const m=new Map();let n=0;ws.forEach(w=>{const g=x.weeks[w];n+=g.n||0;(g.ret||[]).forEach(r=>{if(r.n)m.set(r.p,(m.get(r.p)||0)+r.n)})});return {n,list:[...m.entries()].sort((a,b)=>b[1]-a[1]).map(([p,c])=>({p,c,s:n?c/n:0}))}};
  const L3=agg(played.slice(-3)),LG=agg(played.slice(-1)),SE=agg(played),top=L3.list[0];
  const pat=!top?['muted','No returns']:top.s>=.8?['ok','One man']:top.s>=.5?['warn','Split']:['bad','Committee'];
  const changed=!!(LG.list[0]&&top&&(LG.list[0].p!==top.p||Math.abs((LG.list.find(z=>z.p===top.p)?.s||0)-top.s)>=.3));
  return {L3,LG,SE,pat,changed,lw:played[played.length-1],topS:top?top.s:0}}
const rgShareTxt=a=>a.list.length?a.list.slice(0,3).map(z=>`${esc(rgLast(z.p))} ${Math.round(z.s*100)}%`).join(' / '):`<span class="note">0 returns</span>`;
// injury checker (official reports + inactives); upcoming = this week
function rgChk(t){const C=S.returns?.checker;return C?.upcoming?.[t]||null}
const RG_FL={RETURNER_BACK:['ok','Returner back'],RETURNER_OUT:['bad','Returner out'],OFFENSE_NEED:['warn','Needed on offense'],SHARE_AT_RISK:['warn','Share at risk']};
const rgFlagChips=fl=>(fl||[]).map(([k,txt])=>`<span class="chip rg-${(RG_FL[k]||['muted'])[0]}" title="${esc(txt)}">${esc((RG_FL[k]||[0,k])[1])}</span>`).join(' ');
function rgChkCell(t){const c=rgChk(t);if(!c)return S.returns?.checker?.upcomingWeek?'<span class="note">Bye or no report</span>':'<span class="note">This week\'s report not in yet</span>';
  return `<span>${c.predicted?`Likely: <b>${esc(rgLast(c.predicted))}</b>`:'<span class="note">No returner with history</span>'}</span> ${rgFlagChips(c.flags)}`}
function rgInjTeam(t){const I=S.returns?.injuries;if(!I)return '<p class="note">No injury data in this refresh.</p>';const C=S.returns.checker,cur=I.current?.teams?.[t]||[],up=rgChk(t);
  const hist=(C?.history||[]).filter(r=>r.team===t);
  return `<section class="panel"><div class="ph"><h2>Injury check</h2><span class="eyebrow">Official NFL injury reports + game-day inactives</span></div>
   ${up?`<p>Week ${C.upcomingWeek}: likely main kick returner <b>${esc(up.predicted||'unknown')}</b> ${rgFlagChips(up.flags)}</p>${(up.flags||[]).map(f=>`<p class="note">• ${esc(f[1])}</p>`).join('')}`:''}
   <div class="tw"><table><thead><tr><th>Week ${I.current?.week??''} report</th><th>Pos</th><th>Injury</th><th>Practice</th><th>Status</th></tr></thead><tbody>
   ${cur.length?cur.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2]||'Not listed')}</td><td>${esc(r[3]||'Not listed')}</td><td>${esc(r[4]||'No status')}</td></tr>`).join(''):`<tr><td colspan="5" class="note">No skill-position or DB players on this week's official report yet${I.current?.asOf?` (checked ${esc(I.current.asOf)})`:''}.</td></tr>`}
   </tbody></table></div>
   <ul class="list">${hist.map(r=>{const o=I.weeks?.[r.week]?.[t]?.out||[];return `<li><b>Wk ${r.week}</b> · out: ${o.length?o.map(x=>esc(x[0])+' ('+esc(x[1])+')').join(', '):'none at RB/WR/TE/DB'}<br>${r.actual?`Main returner: <b>${esc(r.actual)}</b>${r.predicted?` · checker said ${esc(r.predicted)} ${r.hit?'✓':'✗'}`:''}`:'No kick returns'} ${rgFlagChips(r.flags)}</li>`}).join('')}</ul>
   <p class="note">Checker record so far: right on ${C?.backtest?.right??'n/a'} of ${C?.backtest?.games??'n/a'} games (main kick returner, weeks 2+, using only what was known before kickoff).</p></section>`}

/* ---------- Returner rankings: column picker + player detail (Oct 7, Joe) ---------- */
// Every column except Player can be switched off; depth-chart columns start off. Choice remembered in this browser.
const RG_COLS=[
 {k:'team',l:'NFL',sort:'team',cell:p=>`<td>${esc(p.team)}</td>`},
 {k:'opp',l:()=>`Wk ${rgWk()} opponent`,sort:'opp',cell:p=>`<td>${rgOppHtml(p.team,true)}</td>`},
 {k:'oppk',l:'Opp kick returns/gm (last 3)',num:1,kr:1,sort:'oppk',cell:p=>`<td class="num">${rgOppCell(p)}</td>`},
 {k:'oppy',l:'Opp return yds/gm (last 3)',num:1,kr:1,sort:'oppy',cell:p=>`<td class="num">${rgYdsCell(p)}</td>`},
 {k:'exp',l:'Expected this week',num:1,kr:1,sort:'exp',cell:p=>`<td class="num">${rgExpTxt(p)}</td>`},
 {k:'owner',l:'Owner',sort:'owner',cell:p=>`<td>${p.owner==='Free agent'?'<span class="chip rg-ok">Free agent</span>':p.owner==='Not in ESPN fantasy'?'<span class="note">Not in ESPN fantasy (defender)</span>':p.owner==='No ESPN id match'?'<span class="note">Not matched to an ESPN player</span>':esc(p.owner||'Owner unknown')}</td>`},
 {k:'site',l:'Team site',sort:'site',off:1,cell:(p,M_)=>`<td>${rgRank(M_,p,'site')}</td>`},
 {k:'espn',l:'ESPN',sort:'espn',off:1,cell:(p,M_)=>`<td>${rgRank(M_,p,'espn')}</td>`},
 {k:'lw',l:'Last game',num:1,sort:'lw',cell:p=>`<td class="num">${p.lwSh}% <span class="note">(${p.lwTxt})</span></td>`},
 {k:'sh3',l:'Share (3 games)',num:1,sort:'sh3',cell:p=>`<td class="num">${p.sh3}%</td>`},
 {k:'fc3',l:'Fair catches (3)',num:1,fc:1,sort:'fc3',cell:p=>`<td class="num">${p.fc3??'<span class="note">Unknown</span>'}</td>`},
 {k:'pts3',l:'Pts/game (3)',num:1,sort:'pts3',cell:p=>`<td class="num"><b>${p.pts3}</b></td>`},
 {k:'totK',l:'KR pts',num:1,both:1,sort:'totK',cell:p=>`<td class="num">${p.totK}</td>`},
 {k:'totP',l:'PR pts',num:1,both:1,sort:'totP',cell:p=>`<td class="num">${p.totP}</td>`},
 {k:'tot',l:'Season pts',num:1,sort:'tot',cell:p=>`<td class="num">${p.tot}</td>`},
 {k:'weeks',l:'Returns by week',cell:(p,M_)=>`<td>${rgWeeks(M_,p)}</td>`}];
let RG_HIDE=new Set(RG_COLS.filter(c=>c.off).map(c=>c.k));
try{const v=localStorage.getItem('lt-rg-hide');if(v)RG_HIDE=new Set(JSON.parse(v))}catch(e){}
const rgColLabel=c=>typeof c.l==='function'?c.l():c.l;
const rgColsFor=hasFc=>RG_COLS.filter(c=>(!c.kr||RF.kind!=='pr')&&(!c.fc||hasFc)&&(!c.both||RF.kind==='both'));
let RG_COLOPEN=false;
function rgColBar(hasFc){const cs=rgColsFor(hasFc),on=cs.filter(c=>!RG_HIDE.has(c.k)).length;
  return `<div class="rgcolw"><button class="rgcolbtn" data-rgcolopen="1" aria-expanded="${RG_COLOPEN}">Columns <span class="note">${on} of ${cs.length}</span> <i>${RG_COLOPEN?'▴':'▾'}</i></button>
  ${RG_COLOPEN?`<div class="rgcolpanel" role="group" aria-label="Show columns">${cs.map(c=>`<label><input type="checkbox" data-rgcol="${c.k}" ${RG_HIDE.has(c.k)?'':'checked'}> ${esc(rgColLabel(c))}</label>`).join('')}
   <div class="rgcolact"><button class="link" data-rgcolall="1">Show all</button><button class="link" data-rgcoldef="1">Default</button><button class="rst" data-rgcolopen="1">Done</button></div></div>`:''}</div>`}
let RG_ROWMAP=new Map();
function rgRankTable(M_,rows,hasFc){const cols=rgColsFor(hasFc).filter(c=>!RG_HIDE.has(c.k));RG_ROWMAP=new Map(rows.map(p=>[rgKey(p),p]));
  return `<div class="tw"><table><thead><tr>${sh('rp','player','Player')}${cols.map(c=>c.sort?sh('rp',c.sort,rgColLabel(c),c.num?1:0):`<th>${esc(rgColLabel(c))}</th>`).join('')}</tr></thead><tbody>
  ${rows.slice(0,RF.n).map(p=>`<tr class="row ${p.ours?'me':''}" tabindex="0" data-rgplayer="${esc(rgKey(p))}" title="Tap for depth charts and details"><td><b>${esc(p.name)}</b> <span class="note">${esc(p.pos)}</span></td>${cols.map(c=>c.cell(p,M_)).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length+1}" class="note">No returners match this filter.</td></tr>`}
  </tbody></table></div>`}
function openRgPlayer(key){const p=RG_ROWMAP.get(key);const M_=rgModel(RF.kind);if(!p||!M_||M_.error)return;
  const st=RF.kind!=='both'?[rgStatus1(p,M_,RF.kind)]:['kr','pr'].map(k=>{const m=rgModel(k),q=rgRows(m).find(q=>rgKey(q)===rgKey(p)||(q.team===p.team&&rgSame(q.name,p.name)));return q&&(q.site[k]||q.espn[k]||q.tot||q.sh3)?rgStatus1(q,m,k):null}).filter(Boolean);
  const x=rgExp(p),c=rgChk(p.team);
  drawer(`<div class="dh"><div><div class="eyebrow">${esc(p.pos)} · ${esc(p.team)} · ${esc(p.owner)}</div><h2 id="dtitle">${esc(p.name)}</h2><div class="note">Week ${rgWk()}: ${rgOppHtml(p.team)}</div></div><button class="x" aria-label="Close" data-close>×</button></div>
  <div class="chips">${st.map(rgChip).join('')}</div>
  <section class="panel"><div class="ph"><h2>Depth charts today</h2></div><div class="tw"><table><tbody>
    <tr><td>Team site</td><td>${rgRank(M_,p,'site')}</td></tr><tr><td>ESPN</td><td>${rgRank(M_,p,'espn')}</td></tr></tbody></table></div>
    <p class="note">Depth charts checked ${esc(S.returns.checked||'date not recorded')}. <button class="link" data-rgteam="${esc(p.team)}">Open ${esc(p.team)} team detail</button></p></section>
  <div class="facts"><div class="fact"><b>${p.lwSh}%</b><span>Last game share (${esc(p.lwTxt)})</span></div><div class="fact"><b>${p.sh3}%</b><span>Share, last ${p.n3??3} games</span></div><div class="fact"><b>${p.pts3}</b><span>Return pts/game, last 3</span></div>
   <div class="fact"><b>${p.tot}</b><span>Season return pts</span></div>${RF.kind!=='pr'&&x.k?`<div class="fact"><b>${rgF(x.er)}</b><span>Expected kick returns vs ${x.opp}</span></div><div class="fact"><b>${rgF(x.ep)}</b><span>Expected kick-return pts</span></div>`:''}</div>
  ${RF.kind!=='pr'?`<p>Opponent: kick returns allowed/game ${rgOppCell(p)} · return yds allowed/game ${rgYdsCell(p)}</p>`:''}
  <p>${rgWeeks(M_,p)}</p>
  ${c?`<p>Injury check: likely main kick returner <b>${esc(c.predicted||'unknown')}</b> ${rgFlagChips(c.flags)}</p>${(c.flags||[]).map(f=>`<p class="note">• ${esc(f[1])}</p>`).join('')}`:''}`)}

function datesStrip(){const D=M?.dates||{},fr=[['ESPN numbers',S.meta?.updatedAt],['News',S.news.ours?.updatedAt],['Practice',S.practice?.updatedAt],['Rumors',S.news.desk?.updatedAt]];
  const el=$('#dates');if(!el)return;const due=waiverDue();el.innerHTML=`${due?`<span>Claims due <b>${whenTxt(due)}</b></span>`:''}${D.kickoff?`<span>Kickoff <b>${whenTxt(D.kickoff)}</b></span>`:''}${D.tradeDeadline?`<span>Trade deadline <b>${whenTxt(D.tradeDeadline)}</b></span>`:''}<span class="fr">Updated: ${fr.map(([k,v])=>`${k} ${v?fmtShort(v):'not loaded'}`).join(' · ')} · ${esc(checksTxt())}</span>`}
function render(){M=S.extras||null;try{normalize()}catch(e){console.warn('normalize failed',e)}mergePlans();datesStrip();const v={overview,returns:returnsView,league,roster,market,news:newsView,notes:notesView}[S.view];let body;try{body=v()}catch(e){console.warn('view failed',S.view,e);body=`<div class="empty">This tab couldn't be drawn from the current data (${esc(e.message||e)}). Some fields are missing or in an unexpected shape; the other tabs still work. Details are in the browser console.</div>`}let bn='';try{bn=banners()}catch(e){bn=`<div class="banner amber"><b>Data status unavailable:</b> ${esc(e.message||e)}</div>`}$('#view').innerHTML=bn+body;
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===S.view));
  if(S.meta){const dt=dataTime();$('#stamp').textContent=`Week ${LGD().week??S.meta.week} · data updated ${dt?fmtShort(dt):'time unknown'}${dt&&(Date.now()-dt)/36e5>STALE_H?' (stale)':''}`}}
function setView(v){S.view=v;try{localStorage.setItem('lt-bi-view',v)}catch(e){}render()}
document.addEventListener('click',e=>{if(e.target.closest('select'))return;
  const rf=e.target.closest('[data-rf]');if(rf){RF.k=rf.dataset.rf;RF.n=25;return render()}
  const rk=e.target.closest('[data-rk]');if(rk){RF.kind=rk.dataset.rk;RF.n=25;try{localStorage.setItem('lt-rg-kind',RF.kind)}catch(x){}return render()}
  if(e.target.closest('[data-rmore]')){RF.n=999;return render()}
  if(e.target.closest('[data-rmine]')){RF.mine=!RF.mine;try{localStorage.setItem('lt-rg-mine',RF.mine?'1':'0')}catch(x){}return render()}
  const rgo=e.target.closest('[data-rgopp]');if(rgo){e.stopPropagation();return openRgOpp(rgo.dataset.rgopp)}
  if(e.target.closest('[data-rgcolopen]')){RG_COLOPEN=!RG_COLOPEN;return render()}
  if(e.target.closest('[data-rgcolall]')){RG_HIDE=new Set();try{localStorage.setItem('lt-rg-hide','[]')}catch(x){}return render()}
  if(e.target.closest('[data-rgcoldef]')){RG_HIDE=new Set(RG_COLS.filter(c=>c.off).map(c=>c.k));try{localStorage.removeItem('lt-rg-hide')}catch(x){}return render()}
  if(RG_COLOPEN&&!e.target.closest('.rgcolw')&&document.querySelector('.rgcolpanel')){RG_COLOPEN=false;render()}
  const rgc=e.target.closest('[data-rgcol]');if(rgc){const k=rgc.dataset.rgcol;RG_HIDE.has(k)?RG_HIDE.delete(k):RG_HIDE.add(k);try{localStorage.setItem('lt-rg-hide',JSON.stringify([...RG_HIDE]))}catch(x){}return render()}
  const rgp=e.target.closest('[data-rgplayer]');if(rgp&&!e.target.closest('a,button')){return openRgPlayer(rgp.dataset.rgplayer)}
  const rgt=e.target.closest('[data-rgteam]');if(rgt){return openRgTeam(rgt.dataset.rgteam)}
  const nf=e.target.closest('[data-nf]');if(nf){NF.k=nf.dataset.nf;NF.n=5;return render()}
  const ng=e.target.closest('[data-ng]');if(ng){NF.open[ng.dataset.ng]=!NF.open[ng.dataset.ng];return render()}
  if(e.target.closest('[data-nmore]')){NF.n+=10;return render()}
  const lgb=e.target.closest('[data-jump]');if(lgb){return setView(lgb.dataset.jump)}
  const rs=e.target.closest('[data-reset]');if(rs){Object.assign(SORT[rs.dataset.reset],SORT_DEF[rs.dataset.reset]);return render()}
  const so=e.target.closest('[data-sort]');if(so){const [t,k]=so.dataset.sort.split(':');return setSort(t,k)}
  const mb=e.target.closest('[data-memo]');if(mb){S.memoSel=mb.dataset.memo;return render()}
  const el=e.target.closest('[data-v],[data-player],[data-team],[data-goto],[data-close]');
  if(e.target.id==='scrim')return closeDrawer(); if(!el)return;
  if(el.dataset.v)return setView(el.dataset.v);
  if(el.dataset.goto){closeDrawer();return setView(el.dataset.goto)}
  if('close' in el.dataset)return closeDrawer();
  if(el.dataset.player)return openPlayer(el.dataset.player);
  if(el.dataset.team)return openTeam(el.dataset.team);});
document.addEventListener('change',async e=>{const sel=e.target.closest('select[data-plan]');if(!sel||!savePlan)return;const id=sel.dataset.plan,tag=sel.value,prev=S.plans[id];
  if(tag==='__staff')delete S.plans[id];else S.plans[id]={tag,week:S.meta?.week,name:S.raw[id]?.name||'',setAt:new Date().toISOString()};render();
  try{await savePlan(id,S.plans[id]||null)}catch(err){console.warn('plan save failed',err);if(prev)S.plans[id]=prev;else delete S.plans[id];render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#drawer').hidden)closeDrawer();
  if(e.key==='Enter'&&e.target.matches('tr.row')){const t=e.target;t.dataset.rgplayer?openRgPlayer(t.dataset.rgplayer):t.dataset.rgteam?openRgTeam(t.dataset.rgteam):t.dataset.player?openPlayer(t.dataset.player):openTeam(t.dataset.team)}});
try{const v=localStorage.getItem('lt-bi-view');if(v&&['overview','returns','league','roster','market','news','notes'].includes(v))S.view=v}catch(e){}
render();

(async()=>{
  async function load(){
    try{const r=await fetch('data/bundle.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const b=await r.json();
      S.meta=b.meta;S.odds=b.odds||{};S.scores=b.scores||{};S.raw=b.players||{};S.returns=b.returns?.current||null;S.extras=b.extras?.current||null;S.waivers=b.waivers;S.news=b.news||{};S.practice=b.practice;S.memos=b.memos||{};
      S.league=b.league||b.meta?.league||b.extras?.current?.league||null;S.validation=b.validation||null;S.sections=b.sections||null;S.builtAt=b.builtAt||null;S.returns=b.returns?.current||S.returns||null;S.loadError=null;
      // data/validation.json is written every run, even when a run was blocked, so it can be newer than bundle.validation
      try{const v=await fetch('data/validation.json?t='+Date.now(),{cache:'no-store'});if(v.ok){const V=await v.json();if(!S.validation||!S.validation.checkedAt||(V.checkedAt&&new Date(V.checkedAt)>=new Date(S.validation.checkedAt)))S.validation=V}}catch(e){}
      render();}
    catch(e){if(!S.meta){$('#view').innerHTML=`<div class="empty">Couldn't load data/bundle.json (${esc(e.message||e)}). The refresh may not have published yet; this page retries every 10 minutes.</div>`;$('#stamp').textContent='Offline'}else{S.loadError=String(e.message||e);render()}}
  }
  try{S.plans=JSON.parse(localStorage.getItem('lt-plans')||'{}')}catch(e){S.plans={}}
  savePlan=async()=>{try{localStorage.setItem('lt-plans',JSON.stringify(S.plans))}catch(e){}};
  await load(); setInterval(load,10*60*1000);
})();
})();
</script>
