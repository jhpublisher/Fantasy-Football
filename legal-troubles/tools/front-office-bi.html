<style>
/* Layout: BI console in the CEO Briefing's identity — sticky top bar with tabs (Overview, League, Our Roster, Market), every team and player clickable into one detail drawer so the numbers link together. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --sunk:#eceee9; --ink:#14201b; --muted:#5d6b64; --line:#d9ded9;
  --field:#1d4a3a; --brass:#8a5d12; --brass-soft:#f3e7cf; --good:#2f7d4f; --warn:#9a5212; --bar-low:#aab4ae; --bad:#b23a32; --info:#2f5d8a;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1512; --surface:#16201c; --sunk:#111a16; --ink:#e9eee9; --muted:#9aa8a1; --line:#2a3832;
  --field:#5fae8c; --brass:#e0a948; --brass-soft:#3a2e17; --good:#5cc286; --warn:#e39a52; --bad:#ec7a70; --info:#7aa9d6; --bar-low:#4b5b54; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1512; --surface:#16201c; --sunk:#111a16; --ink:#e9eee9; --muted:#9aa8a1; --line:#2a3832;
  --field:#5fae8c; --brass:#e0a948; --brass-soft:#3a2e17; --good:#5cc286; --warn:#e39a52; --bad:#ec7a70; --info:#7aa9d6; --bar-low:#4b5b54; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:12px 0;display:grid;gap:10px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:1.7rem;margin:0;line-height:1}
.brand h1 span{color:var(--brass)}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.tab:focus-visible,.link:focus-visible,.row:focus-visible,.card:focus-visible,.x:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:22px 60px;display:grid;gap:22px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:2px}
.kpi .v{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums}
.kpi .k{font-size:.78rem;color:var(--muted)}
.kpi.hl .v{color:var(--brass)}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0}
.panel h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:1.35rem;margin:0;line-height:1}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.num,th.num{text-align:right}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--sunk)}
tr.me td{background:var(--brass-soft)}
.heat tr.me td{background:none}
.heat tr.me td:first-child{box-shadow:inset 4px 0 0 var(--brass);font-weight:700}
.heat tr.me td.h100{background:color-mix(in srgb,var(--good) 28%,transparent)}
.heat tr.me td.hhigh{background:color-mix(in srgb,var(--good) 50%,transparent)}
.pbar{display:flex;align-items:center;gap:10px}.pbar .bar{flex:1}.pbar span{min-width:3.2em;text-align:right}
.flag{font-size:.82rem;border-left:3px solid var(--warn);padding:6px 10px;background:var(--sunk);border-radius:4px}
tr.cut td{border-bottom:2px dashed var(--ink)}
.link{background:none;border:0;padding:0;cursor:pointer;font-weight:600;text-align:left;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.link:hover{text-decoration-color:var(--brass)}
.chip{display:inline-block;font-family:var(--mono);font-size:.76rem;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.s-ACTIVE{color:var(--good)} .s-QUESTIONABLE,.s-DAY_TO_DAY{color:var(--warn)} .s-OUT,.s-INJURY_RESERVE,.s-DOUBTFUL,.s-SUSPENSION{color:var(--bad)}
.t-sell{color:var(--warn)} .t-claim,.t-target,.t-buy{color:var(--good)} .t-rental{color:var(--info)} .t-drop{color:var(--bad)} .t-stash{color:var(--muted)} .t-roster{color:var(--muted)}
/* 15: plan tags as neutral pills (color reserved for status/risk) */
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:.76rem;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.tag b{font-weight:700;font-family:var(--body)}
.mcol h3.n{color:var(--ink)}
/* mock chrome */
.mockbar{background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:.74rem;letter-spacing:.04em}
.mockbar .in{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mockbar b{letter-spacing:.12em}

.mockbar .lg button{font:inherit;font-size:.7rem;background:transparent;color:var(--bg);border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);border-radius:999px;padding:1px 8px;cursor:pointer}
.mockbar .lg button:hover{border-color:var(--bg)}
.nw{display:inline-grid;place-items:center;min-width:1.6em;height:1.6em;padding:0 5px;border-radius:999px;background:var(--brass);color:var(--surface);font-family:var(--mono);font-size:.68rem;font-weight:700;letter-spacing:0;vertical-align:middle;margin-left:6px}
body.nomark .nw{display:none}
/* 24: key dates strip */
.dates{display:flex;gap:6px 18px;flex-wrap:wrap;font-family:var(--mono);font-size:.72rem;color:var(--muted);padding-bottom:8px;align-items:center}
.dates b{color:var(--ink);font-weight:600}
.dates .fr{margin-left:auto}
/* 19: this week */
.week{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:10px;padding:16px}
.vs{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.vs .side{display:grid;gap:2px}
.vs .side b{font-family:var(--display);font-size:2.2rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}

.vs .mid{font-family:var(--display);font-size:1.2rem;color:var(--muted)}
.wp{display:grid;gap:4px;min-width:160px;flex:1}
.wp .bar i{background:var(--brass)}
.due{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:.9rem}
.due li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.due li:last-child{border-bottom:0}

/* 25: KPI deltas */
.kpi .d{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.kpi .d.up{color:var(--good)} .kpi .d.dn{color:var(--bad)}
/* 20/21: grids */
.grid td.c{text-align:center;font-family:var(--mono);font-size:.76rem}

.tot td{font-weight:700;border-top:2px solid var(--ink)}
.m-easy{background:color-mix(in srgb,var(--good) 26%,transparent);border-radius:4px}

.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
/* 23: free agents */
.fa{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.fa h3{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:1.05rem;margin:0}
.fa ol{margin:0;padding:0;list-style:none;display:grid;gap:6px}

.fa li span{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
/* 16: grouped news */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.ngroup{border-bottom:1px solid var(--line);padding-block:12px;display:grid;gap:6px}
.ngroup .hd{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ngroup .more{background:none;border:0;padding:0;color:var(--info);font:inherit;font-size:.82rem;cursor:pointer;justify-self:start}
.ngroup .older{display:grid;gap:8px;padding-left:12px;border-left:2px solid var(--line)}
.ngroup .older .hl{font-size:.88rem}
.showmore{justify-self:center;font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer}
@media (max-width:900px){.week{grid-template-columns:1fr}.fa{grid-template-columns:repeat(3,minmax(0,1fr))}}

.bar{height:8px;border-radius:4px;background:var(--sunk);position:relative;min-width:80px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--field)}
.me .bar i{background:var(--brass)}
.srt{background:none;border:0;padding:0;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;display:inline-flex;gap:4px;align-items:center}
.srt i{font-style:normal;opacity:.45;font-size:.65rem}
.srt.on{color:var(--ink)}.srt.on i{opacity:1;color:var(--brass)}
.srt:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.phr{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.rst{background:var(--brass-soft);border:1px solid var(--brass);color:var(--ink);border-radius:999px;padding:2px 10px;font-family:var(--mono);font-size:.7rem;cursor:pointer}
.rst:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.planw{display:grid;gap:2px;justify-items:start}
.was{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.was b{color:var(--brass);font-weight:600}
.plan{font:inherit;font-size:.82rem;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}
.plan.mine{border-color:var(--brass);box-shadow:inset 3px 0 0 var(--brass)}
.plan:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.heat td.h{text-align:center;font-family:var(--mono);font-size:.78rem;border-radius:4px}
.h100{background:color-mix(in srgb,var(--good) 28%,transparent)}
.hhigh{background:color-mix(in srgb,var(--good) 50%,transparent);font-weight:700}
.market{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
.mcol{display:grid;gap:8px}
.mcol h3{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:1.1rem;margin:0;color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:4px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--ink)}
.card .n{font-weight:600}
.card .m{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.card .r{font-size:.8rem;color:var(--muted)}
.note{font-size:.82rem;color:var(--muted);margin:0}
.banner{border-radius:10px;padding:12px 16px;display:grid;gap:4px;font-size:.9rem;border:1px solid}
.banner b{font-weight:700}.banner ul{margin:0;padding-left:20px}
.banner.red{background:color-mix(in srgb,var(--bad) 14%,var(--surface));border-color:var(--bad)}
.banner.amber{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border-color:var(--warn)}
.secmsg{font-size:.85rem;border-left:3px solid var(--warn);padding:6px 10px;background:var(--sunk);border-radius:4px}
.secmsg.err{border-left-color:var(--bad)}
.dim{color:var(--muted);font-size:.68rem;font-family:var(--mono)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--muted)}
svg text{font-family:var(--mono)}
/* drawer */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 35%,transparent);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--bg);z-index:21;border-left:1px solid var(--line);overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;align-content:start}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:start}
.dh h2{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:2rem;margin:0;line-height:1}
.x{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:1.1rem}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:2px}
.fact b{font-family:var(--display);font-size:1.5rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.fact span{font-size:.72rem;color:var(--muted)}
.why{background:var(--brass-soft);border-radius:8px;padding:12px;font-size:.92rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}
ul.list{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.o-Likely{color:var(--good)} .o-Contested{color:var(--warn)} .o-Unlikely{color:var(--bad)} .o-Hold{color:var(--info)}
.src{font-family:var(--mono);font-size:.72rem;color:var(--info)}
.news a{color:var(--ink)}
.trend li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.health{display:flex;flex-wrap:wrap;gap:6px}
.k-Rumor{color:var(--warn)} .k-Confirmed{color:var(--good)} .k-Analysis{color:var(--muted)} .k-News{color:var(--info)}
.rumor{display:grid;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
.rumor:last-child{border-bottom:0}
.rumor .c{font-weight:600}
.rumor .i{font-size:.9rem;color:var(--muted)}
.claimbox{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:6px;background:var(--surface)}
.news li{display:grid;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}
.news li:last-child{border-bottom:0}
.news .meta{font-family:var(--mono);font-size:.7rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.news .hl{font-size:.92rem}
.prac td.d{text-align:center}
.p-Full{color:var(--good)} .p-Limited{color:var(--warn)} .p-DNP{color:var(--bad)}

.mode b{font-family:var(--display);font-size:1.6rem;font-weight:900;letter-spacing:.02em}
.memo-pick{display:flex;gap:6px;flex-wrap:wrap}

@media (max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.market{grid-template-columns:repeat(2,minmax(0,1fr))}}

</style>

<script>
(function(){
const S={league:null,validation:null,sections:null,builtAt:null,returns:null,dbError:null,meta:null,odds:{},scores:{},players:{},waivers:null,news:{},practice:null,memos:{},memoSel:null,view:'overview',raw:{},plans:{}};
const PLAN_OPTS=[['','No plan'],['sell','Sell high'],['buy','Buy low'],['target','Target'],['claim','Claim'],['rental','Rental'],['stash','Stash'],['drop','Drop']];
let savePlan=null;
function mergePlans(){const wk=S.meta?.week,base={};
  for(const [id,p] of Object.entries(S.raw)){const q={...p};if(isExpired(q.claim)){q.claimExpired=q.claim;delete q.claim}if(q.tag&&q.tag!=='roster'&&(q.tagExpired||isExpired(q.tagMeta))){q.expiredTag=q.tag;q.tag='roster'}if(q.note&&(q.noteExpired||q.expired)){q.expiredNote=q.note;delete q.note}base[id]={...q,staffTag:q.tag}}
  const byName=Object.fromEntries(Object.entries(base).map(([id,p])=>[p.name,id]));
  for(const p of Object.values(base)){const c=p.claim;if(!c||!c.drop||c.odds==='Hold')continue;const d=base[byName[c.drop]];if(!d||!d.ours)continue;
    if(!d.tag||d.tag==='roster'){d.tag='drop';d.staffTag='drop'}if(d.tag==='drop')d.dropFor=(d.dropFor?d.dropFor+', ':'')+p.name}
  S.players={};for(const [id,p] of Object.entries(base)){const o=S.plans[id];S.players[id]=(o&&wk!=null&&o.week===wk)?{...p,tag:o.tag||'roster',mine:true}:p}}

  const inWeek=d=>{if(!ko||isNaN(ko))return true;const x=dayDate(d);return x>new Date(ko-8*864e5)&&x<new Date(+ko+5*864e5)};
  const prWeekOk=pr&&(pr.week==null||wk==null||+pr.week===+wk);
  if(prWeekOk)for(const [n,p] of Object.entries(pr?.players||{})){if(p.kickoffET&&new Date(p.kickoffET)<Date.now()-12*36e5)continue;const win=Array.isArray(p.window)&&p.window.length===2?p.window:null;const days=Object.fromEntries(Object.entries(p.days||{}).filter(([d,x])=>win&&x?.date?(x.date>=win[0]&&x.date<=win[1]):inWeek(d)));if(Object.keys(days).length)out[n]={...p,days}}

   ${(()=>{const it=[...(S.news.ours?.items||[]),...(S.news.league?.items||[])].filter(i=>i.player===p.name).slice(0,4);return it.length?`<section class="panel"><div class="ph"><h2>Latest news</h2></div>${newsList(it)}</section>`:''})()}
   <section class="panel"><div class="ph"><h2>Playoff schedule</h2></div><div class="chips">${(p.playoffs||[]).length?(p.playoffs).map((o,i)=>chip('t-roster','Wk '+(LGD().playoffWeeks[i]??'?')+' '+(typeof o==='object'?o.opp:o))).join(''):'<span class="note">No playoff schedule in this refresh</span>'}</div></section>
   ${!p.ours?`<section class="panel"><div class="ph"><h2>Owner</h2></div><div>${p.owner==='Free agent'?'Free agent':`<button class="link" data-team="${esc(p.owner)}">${esc(p.owner)}</button>${t?` <span class="note">${wlt(t)} · playoffs ${pct(t.playoffPct)}</span>`:''}`}</div></section>`:''}`);
}
function openTeam(name){try{openTeam_(name)}catch(e){console.warn('drawer failed',e);drawer(`<div class="dh"><h2 id="dtitle">${esc(name)}</h2><button class="x" aria-label="Close" data-close>×</button></div><p class="note">This team's details couldn't be shown (${esc(e.message||e)}).</p>`)}}
function openTeam_(name){const t=teamByName(name);if(!t)return;const s=teamScores(name);
  const ours=Object.entries(S.players).filter(([,p])=>p.owner===name&&!p.ours);
  drawer(`<div class="dh"><div><div class="eyebrow">Seed ${t.seed} · ${wlt(t)}</div><h2 id="dtitle">${esc(name)}</h2></div><button class="x" aria-label="Close" data-close>×</button></div>
   <div class="facts"><div class="fact"><b>${pct(t.playoffPct)}</b><span>Playoff odds</span></div><div class="fact"><b>${pct(t.byePct)}</b><span>#1 seed</span></div><div class="fact"><b>${t.pf!=null?t.pf.toFixed(0):'n/a'}</b><span>Points for</span></div><div class="fact"><b>${avgPPG(t.name)}</b><span>Avg PPG</span></div><div class="fact"><b>${t.strength??'n/a'}</b><span>Strength</span></div><div class="fact"><b>${t.hundreds??'n/a'}</b><span>100+ games</span></div></div>
   <section class="panel"><div class="ph"><h2>Weekly scores</h2><span class="eyebrow">100 line</span></div>${barsSVG(s,{line:100,hi:100})}</section>
   ${ours.length?`<section class="panel"><div class="ph"><h2>Players we're watching</h2></div><ul class="list">${ours.map(([id,p])=>`<li>${tagChip(p.tag)} <button class="link" data-player="${id}">${esc(p.name)}</button> <span class="note">${esc(p.pos)}</span></li>`).join('')}</ul></section>`:''}`);
}
let lastFocus=null;
function drawer(html){lastFocus=document.activeElement;const d=$('#drawer');d.innerHTML=html;d.hidden=false;$('#scrim').hidden=false;d.querySelector('[data-close]')?.focus()}
function closeDrawer(){$('#drawer').hidden=true;$('#scrim').hidden=true;lastFocus?.focus?.()}

/* ---------- wiring ---------- */
function datesStrip(){const D=M?.dates||{},fr=[['ESPN numbers',S.meta?.updatedAt],['News',S.news.ours?.updatedAt],['Practice',S.practice?.updatedAt],['Rumors',S.news.desk?.updatedAt]];
  const el=$('#dates');if(!el)return;const due=waiverDue();el.innerHTML=`${due?`<span>Claims due <b>${whenTxt(due)}</b></span>`:''}${D.kickoff?`<span>Kickoff <b>${whenTxt(D.kickoff)}</b></span>`:''}${D.tradeDeadline?`<span>Trade deadline <b>${whenTxt(D.tradeDeadline)}</b></span>`:''}<span class="fr">Updated: ${fr.map(([k,v])=>`${k} ${v?fmtShort(v):'not loaded'}`).join(' · ')} · ${esc(checksTxt())}</span>`}
function render(){M=S.extras||null;try{normalize()}catch(e){console.warn('normalize failed',e)}mergePlans();datesStrip();const v={overview,league,roster,market,news:newsView,notes:notesView}[S.view];let body;try{body=v()}catch(e){console.warn('view failed',S.view,e);body=`<div class="empty">This tab couldn't be drawn from the current data (${esc(e.message||e)}). Some fields are missing or in an unexpected shape; the other tabs still work. Details are in the browser console.</div>`}let bn='';try{bn=banners()}catch(e){bn=`<div class="banner amber"><b>Data status unavailable:</b> ${esc(e.message||e)}</div>`}$('#view').innerHTML=bn+body;
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===S.view));
  if(S.meta){const dt=dataTime();$('#stamp').textContent=`Week ${LGD().week??S.meta.week} · data updated ${dt?fmtShort(dt):'time unknown'}${dt&&(Date.now()-dt)/36e5>STALE_H?' (stale)':''}`}}
function setView(v){S.view=v;try{localStorage.setItem('lt-bi-view',v)}catch(e){}render()}
document.addEventListener('click',e=>{if(e.target.closest('select'))return;
  const nf=e.target.closest('[data-nf]');if(nf){NF.k=nf.dataset.nf;NF.n=5;return render()}
  const ng=e.target.closest('[data-ng]');if(ng){NF.open[ng.dataset.ng]=!NF.open[ng.dataset.ng];return render()}
  if(e.target.closest('[data-nmore]')){NF.n+=10;return render()}
  const lgb=e.target.closest('[data-jump]');if(lgb){return setView(lgb.dataset.jump)}
  const rs=e.target.closest('[data-reset]');if(rs){Object.assign(SORT[rs.dataset.reset],SORT_DEF[rs.dataset.reset]);return render()}
  const so=e.target.closest('[data-sort]');if(so){const [t,k]=so.dataset.sort.split(':');return setSort(t,k)}
  const mb=e.target.closest('[data-memo]');if(mb){S.memoSel=mb.dataset.memo;return render()}
  const el=e.target.closest('[data-v],[data-player],[data-team],[data-goto],[data-close]');
  if(e.target.id==='scrim')return closeDrawer(); if(!el)return;
  if(el.dataset.v)return setView(el.dataset.v);
  if(el.dataset.goto){closeDrawer();return setView(el.dataset.goto)}
  if('close' in el.dataset)return closeDrawer();
  if(el.dataset.player)return openPlayer(el.dataset.player);
  if(el.dataset.team)return openTeam(el.dataset.team);});
document.addEventListener('change',async e=>{const sel=e.target.closest('select[data-plan]');if(!sel||!savePlan)return;const id=sel.dataset.plan,tag=sel.value,prev=S.plans[id];
  if(tag==='__staff')delete S.plans[id];else S.plans[id]={tag,week:S.meta?.week,name:S.raw[id]?.name||'',setAt:new Date().toISOString()};render();
  try{await savePlan(id,S.plans[id]||null)}catch(err){console.warn('plan save failed',err);if(prev)S.plans[id]=prev;else delete S.plans[id];render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#drawer').hidden)closeDrawer();
  if(e.key==='Enter'&&e.target.matches('tr.row')){const t=e.target;t.dataset.player?openPlayer(t.dataset.player):openTeam(t.dataset.team)}});
try{const v=localStorage.getItem('lt-bi-view');if(v&&['overview','league','roster','market','news','notes'].includes(v))S.view=v}catch(e){}
render();

(async()=>{
  const db=window.claude?await window.claude.use('db'):null;
  if(!db){$('#view').innerHTML='<div class="empty">Open this page signed in to claude.ai to see the live numbers.</div>';$('#stamp').textContent='Offline';return}
  let t=null;const soon=()=>{clearTimeout(t);t=setTimeout(render,60)};
  const err=e=>{console.warn('db read failed',e);S.dbError=String(e?.message||e);soon()};
  db.doc('meta/current').onSnapshot(s=>{S.meta=s.exists?s.data():null;if(S.meta?.sections)S.sections=S.meta.sections;if(S.meta?.validation&&!S.validation)S.validation=S.meta.validation;soon()},err);
  db.collection('odds').onSnapshot(q=>{S.odds={};q.docs.forEach(d=>S.odds[d.id]=d.data());soon()},err);
  db.collection('scores').onSnapshot(q=>{S.scores={};q.docs.forEach(d=>S.scores[d.id]=d.data());soon()},err);
  db.collection('players').onSnapshot(q=>{S.raw={};q.docs.forEach(d=>S.raw[d.id]=d.data());soon()},err);
  db.collection('plans').onSnapshot(q=>{S.plans={};q.docs.forEach(d=>S.plans[d.id]=d.data());soon()},err);
  savePlan=(id,v)=>v?db.doc('plans/'+id).set(v):db.doc('plans/'+id).delete();
  db.doc('waivers/current').onSnapshot(s=>{S.waivers=s.exists?s.data():null;soon()},err);
  db.collection('news').onSnapshot(q=>{S.news={};q.docs.forEach(d=>S.news[d.id]=d.data());soon()},err);
  db.doc('extras/current').onSnapshot(s=>{S.extras=s.exists?s.data():null;S.league=S.extras?.league||null;if(S.extras?.validation)S.validation=S.extras.validation;soon()},err);
  db.doc('validation/current').onSnapshot(s=>{if(s.exists)S.validation=s.data();soon()},err);
  db.doc('practice/current').onSnapshot(s=>{S.practice=s.exists?s.data():null;soon()},err);
  db.collection('memos').onSnapshot(q=>{S.memos={};q.docs.forEach(d=>S.memos[d.id]=d.data());soon()},err);
})();
})();
</script>
